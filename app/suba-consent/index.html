<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>连接 SubA · Entendu</title><style>body{font:16px/1.65 system-ui;background:#f5f7f8;color:#192f39;max-width:580px;margin:64px auto;padding:0 24px}main{background:white;border:1px solid #dce2e5;border-radius:18px;padding:32px}h1{margin:0}button,input{font:inherit;padding:12px;border-radius:8px;margin:6px 0}button{cursor:pointer;background:#174e61;color:white;border:0}button:disabled{opacity:.55;cursor:wait}input{box-sizing:border-box;width:100%;border:1px solid #ccd4d9}label{display:block}small{color:#52636b}#status{white-space:pre-wrap}code{overflow-wrap:anywhere}[hidden]{display:none!important}</style><script type="module" src="./consent.js"></script></head><body><main><h1>连接 SubA</h1><p>使用 Entendu 账号连接 Codex，完成后回到聊天使用字幕工具。</p><p id="status" role="status" aria-live="polite">正在加载…</p><section id="login"><button id="google">使用 Google 登录</button><details><summary>已有邮箱密码账号</summary><label>邮箱<input id="email" type="email" autocomplete="username"></label><label>密码<input id="password" type="password" autocomplete="current-password"></label><button id="password-login">登录</button></details></section><section id="signed-in" hidden><small id="identity"></small> <button id="logout">切换账号</button></section><section id="consent" hidden><h2>允许 <span id="client"></span> 连接？</h2><p>连接后，该客户端可访问你的 SubA 字幕任务与额度，并发起按分钟计费的翻译。付款仍需在结账页面确认。</p><p>请求范围：<code id="scope"></code></p><p>返回地址：<code id="redirect"></code></p><button id="approve">允许连接</button> <button id="deny">拒绝</button></section></main></body></html>
